services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    image: lostlink:production
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the production PostgreSQL URL}
      DATABASE_POOL_MAX_SIZE: ${DATABASE_POOL_MAX_SIZE:-5}
      SESSION_SECRET: ${SESSION_SECRET:?Set a unique SESSION_SECRET}
      SESSION_HTTPS_ONLY: "true"
      REQUIRE_REQUEST_ORIGIN: "true"
      DEMO_MODE: "false"
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to your canonical host, comma-separated}
      PYTHONDONTWRITEBYTECODE: "1"
      USE_SEMANTIC_MODEL: ${USE_SEMANTIC_MODEL:-false}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      USE_CLIP_MODEL: ${USE_CLIP_MODEL:-false}
      CLIP_MODEL: ${CLIP_MODEL:-openai/clip-vit-base-patch32}
      HF_HOME: /model-cache
    volumes:
      - lostlink-uploads:/data/uploads
      - lostlink-model-cache:/model-cache
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  lostlink-uploads:
  lostlink-model-cache:
