name: LostLink AI evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matching-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_SEMANTIC_MODEL: "false"
      USE_CLIP_MODEL: "false"
      USE_IMAGE_ENRICHMENT: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      # Test-only secret required because app.main validates session configuration at import.
      SESSION_SECRET: "lostlink-ci-only-session-secret-not-for-deployment-2026"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run the complete application test suite
        run: python -m pytest -q

      - name: Run deterministic benchmark baseline
        run: |
          python scripts/evaluate_matching.py \
            --dataset tests/data/matching_benchmark_v1.json \
            --output matching-baseline.json

      - name: Upload benchmark report
        if: always() && hashFiles('matching-baseline.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lostlink-matching-baseline
          path: matching-baseline.json
          if-no-files-found: warn
          retention-days: 14

  semantic-benchmark:
    # Run the model-backed benchmark manually to avoid large model downloads on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      USE_SEMANTIC_MODEL: "true"
      USE_CLIP_MODEL: "false"
      USE_IMAGE_ENRICHMENT: "false"
      ALLOW_MODEL_DOWNLOADS: "true"
      MODEL_DOWNLOAD_REVISION: "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache pretrained model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: lostlink-minilm-all-MiniLM-L6-v2-1110a243fdf4706b3f48f1d95db1a4f5529b4d41

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Run baseline and required MiniLM benchmark
        run: |
          python scripts/evaluate_matching.py \
            --dataset tests/data/matching_benchmark_v1.json \
            --require-semantic-model \
            --output matching-model-comparison.json

      - name: Upload model comparison report
        if: always() && hashFiles('matching-model-comparison.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lostlink-minilm-model-comparison
          path: matching-model-comparison.json
          if-no-files-found: warn
          retention-days: 14
