name: LostLink CI

on:
  pull_request:
    branches:
      - feat/lostlink-unified-public-workflow
      - main
  push:
    branches:
      - feat/lostlink-unified-public-workflow
      - fix/lostlink-issue-register-hardening

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      SESSION_SECRET: ci-only-secret-not-used-for-deployment-0123456789abcdef0123456789abcdef
      AUTH_PROVIDER: local
      DEMO_MODE: "false"
      ALLOW_MODEL_DOWNLOADS: "false"
      USE_CLIP_MODEL: "false"
      USE_IMAGE_ENRICHMENT: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile Python modules
        run: python -m compileall -q app
      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
      - name: Run automated tests
        run: pytest -q
